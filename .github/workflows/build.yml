name: Build apps

# Builds a Windows .exe and a macOS .app.
#  - Push a tag like v1.0.0  -> creates a GitHub Release with both downloads.
#  - Or run it by hand from the Actions tab -> downloads appear as build artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: LiveTicker-windows.zip
          - os: macos-latest
            asset: LiveTicker-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install pyinstaller certifi

      - name: Build
        run: python -m PyInstaller --noconfirm --windowed --onefile --name LiveTicker --collect-data certifi live_ticker.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/LiveTicker.exe -DestinationPath ${{ matrix.asset }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent LiveTicker.app ../${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
